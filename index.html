    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
      // Ignore WebSocket errors per environment constraints (HMR disabled in AI Studio)
      window.addEventListener('error', function(event) {
        if (event && (
          (event.message && (event.message.indexOf('WebSocket') !== -1 || event.message.indexOf('createWebSocket') !== -1 || event.message.indexOf('@vite/client') !== -1)) ||
          (event.filename && event.filename.indexOf('@vite/client') !== -1)
        )) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var str = '' + (event.reason ? (event.reason.message || event.reason.stack || event.reason) : '');
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('createWebSocket') !== -1 || str.indexOf('@vite/client') !== -1) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body class="bg-[#f8fafc] text-[#0f172a] font-sans antialiased overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
